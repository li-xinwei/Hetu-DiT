# Eval matrix definition for the warm-pool architecture evaluation.
#
# Each cell is a (workload, pool_config, baseline) triple. The orchestrator
# (scripts/run_eval_matrix.sh) iterates over `cells` in order and writes one
# run subdir per cell.
#
# Use the `small` set for Phase 4 sim validation; expand to `full` for the
# Phase 5 real-mode mentor artifact.

defaults:
  model: sd3
  seed: 0
  # Calibration constants (seconds), passed to eval_sim.py for --mode sim.
  # Real-mode (--mode real) ignores these — they're sim-only knobs.
  t_boot_l2: 25.0
  t_bind_warm: 3.14
  t_bind_cold_l2: 12.0
  t_bind_cold: 35.0

small:
  # 6 cells — Phase 4 gate: report renders, plots non-empty, Pareto frontier
  # passes intuitive sanity (warm=0 top-left, warm>=2 bottom-right).
  - {pattern: burst, n: 8, head_size: 1, warm_replicas: 0}
  - {pattern: burst, n: 8, head_size: 1, warm_replicas: 1}
  - {pattern: burst, n: 8, head_size: 1, warm_replicas: 4}
  - {pattern: poisson, rate: 1.0, duration: 60, head_size: 1, warm_replicas: 0}
  - {pattern: poisson, rate: 1.0, duration: 60, head_size: 1, warm_replicas: 1}
  - {pattern: poisson, rate: 1.0, duration: 60, head_size: 1, warm_replicas: 2}

full:
  # 18-cell sweep — Phase 5 real-mode mentor artifact.
  # 3 workloads x 4 pool configs (warm_replicas 0/1/2/4) = 12 cells,
  # plus 6 extras for steady & mixed-config baselines.
  - {pattern: cold, head_size: 1, warm_replicas: 0}
  - {pattern: burst, n: 8, head_size: 1, warm_replicas: 0}
  - {pattern: burst, n: 8, head_size: 1, warm_replicas: 1}
  - {pattern: burst, n: 8, head_size: 1, warm_replicas: 2}
  - {pattern: burst, n: 8, head_size: 1, warm_replicas: 4}
  - {pattern: poisson, rate: 0.5, duration: 120, head_size: 1, warm_replicas: 0}
  - {pattern: poisson, rate: 0.5, duration: 120, head_size: 1, warm_replicas: 1}
  - {pattern: poisson, rate: 0.5, duration: 120, head_size: 1, warm_replicas: 2}
  - {pattern: poisson, rate: 1.0, duration: 120, head_size: 1, warm_replicas: 0}
  - {pattern: poisson, rate: 1.0, duration: 120, head_size: 1, warm_replicas: 1}
  - {pattern: poisson, rate: 1.0, duration: 120, head_size: 1, warm_replicas: 2}
  - {pattern: poisson, rate: 1.0, duration: 120, head_size: 1, warm_replicas: 4}
  - {pattern: poisson, rate: 2.0, duration: 120, head_size: 1, warm_replicas: 0}
  - {pattern: poisson, rate: 2.0, duration: 120, head_size: 1, warm_replicas: 2}
  - {pattern: poisson, rate: 2.0, duration: 120, head_size: 1, warm_replicas: 4}
  - {pattern: steady, rate: 1.0, duration: 120, head_size: 1, warm_replicas: 0}
  - {pattern: steady, rate: 1.0, duration: 120, head_size: 1, warm_replicas: 2}
  - {pattern: mixed, rate: 1.0, duration: 120, head_size: 1, warm_replicas: 2}
