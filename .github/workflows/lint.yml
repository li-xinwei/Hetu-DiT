name: lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  syntax-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install --upgrade pip ruff==0.6.9

      - name: Compile-all (syntax check)
        # Catches syntax errors across the whole tree without importing
        # anything (so missing torch / ray / nixl deps in CI environment
        # do not block this gate).
        run: |
          python -m compileall -q hetu_dit scripts || (echo "compileall failed" && exit 1)

      - name: Ruff (correctness only)
        # E9: syntax errors / IndentationError that compileall didn't flag
        # F63: invalid is-comparison
        # F7:  syntax errors in expressions
        # (F82 undefined-name dropped — too noisy on existing vendored pipelines)
        # Style/format checks are deliberately NOT enabled — we add those
        # in Phase 2 once a tests/ dir exists and devs are CI-cycle aware.
        run: ruff check --select=E9,F63,F7 hetu_dit scripts
